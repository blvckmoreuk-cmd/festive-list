<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="FestiveList">
  <title>FestiveList</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            berry: { DEFAULT: '#C83737', dark: '#9E2424', light: '#F9EAEB' },
            pine: { DEFAULT: '#2E5A44', dark: '#1C3B2B', light: '#EBF2EE' },
            parchment: { DEFAULT: '#FAF7F2', card: '#FFFFFF', border: '#E8E1D7' },
            gold: { DEFAULT: '#D4A359', light: '#FDF8EF' }
          },
          fontFamily: {
            sans: ['Outfit', 'sans-serif'],
            serif: ['Playfair Display', 'serif'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      background: linear-gradient(180deg, #FAF7F2 0%, #F3EDE3 100%);
      color: #2D3748;
      -webkit-tap-highlight-color: transparent;
    }
    .touch-target { min-height: 44px; min-width: 44px; }
    .bunting {
      height: 6px;
      background: repeating-linear-gradient(90deg, #C83737 0 10px, #FFFFFF 10px 20px, #2E5A44 20px 30px, #D4A359 30px 40px);
    }
    .gift-card {
      background: white;
      border: 1px solid #E8E1D7;
      border-radius: 16px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }
    .price-tag {
      background: #FDF8EF;
      color: #D4A359;
      font-weight: 500;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 12px;
    }
  </style>
</head>
<body class="min-h-screen font-sans">
  <div class="bunting"></div>
  <main class="max-w-xl mx-auto px-4 py-6">
    <header class="flex items-center justify-between mb-6 pb-4 border-b border-parchment-border">
      <div>
        <h1 class="font-serif text-2xl font-bold text-berry">🎄 FestiveList</h1>
        <p id="greeting-text" class="text-sm text-gray-500 mt-0.5">Merry Christmas!</p>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="shareCurrentGroup()" class="p-2.5 rounded-full bg-white border border-parchment-border text-gray-600 touch-target" title="Share this group">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/></svg>
        </button>
      </div>
    </header>

    <div id="group-tabs" class="flex gap-2 mb-4 overflow-x-auto pb-1"></div>

    <div class="flex bg-white/70 p-1 rounded-xl mb-6 border border-parchment-border">
      <button id="tab-feed" onclick="switchTab('feed')" class="flex-1 py-2.5 rounded-lg text-center bg-white text-berry font-semibold shadow-sm">Gift Feed</button>
      <button id="tab-my-list" onclick="switchTab('my-list')" class="flex-1 py-2.5 rounded-lg text-center text-gray-600">My List</button>
      <button id="tab-buying" onclick="switchTab('buying')" class="flex-1 py-2.5 rounded-lg text-center text-gray-600">I'm Buying</button>
    </div>

    <section id="view-feed" class="space-y-3"></section>
    <section id="view-my-list" class="hidden space-y-3">
      <div class="flex justify-between items-center">
        <h2 class="font-serif text-lg">My Requests</h2>
        <button onclick="openAddItemModal()" class="bg-berry text-white px-4 py-2 rounded-xl text-sm">+ Add Gift</button>
      </div>
      <div id="my-items-container" class="space-y-3"></div>
    </section>
    <section id="view-buying" class="hidden space-y-3">
      <h2 class="font-serif text-lg">Gifts I'm Buying</h2>
      <div id="buying-items-container" class="space-y-3"></div>
    </section>
  </main>

  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-gray-900 text-white px-4 py-2 rounded-full text-sm opacity-0 pointer-events-none transition-opacity z-[100]"></div>

  <div id="new-group-modal" class="fixed inset-0 bg-gray-900/40 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-sm w-full p-5">
      <h3 class="font-serif text-lg mb-3">New Group</h3>
      <input id="new-group-name" type="text" placeholder="e.g. Friends, Work, Cousins" class="w-full border rounded-xl px-3 py-2 mb-4">
      <div class="flex gap-2">
        <button type="button" onclick="closeNewGroupModal()" class="flex-1 py-2.5 border rounded-xl">Cancel</button>
        <button type="button" onclick="createGroup()" class="flex-1 bg-berry text-white py-2.5 rounded-xl">Create</button>
      </div>
    </div>
  </div>

  <div id="add-item-modal" class="fixed inset-0 bg-gray-900/40 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-sm w-full p-5">
      <h3 class="font-serif text-lg mb-3">Add a Gift</h3>
      <input id="gift-title" type="text" placeholder="What do you want?" class="w-full border rounded-xl px-3 py-2 mb-2">
      <input id="gift-price" type="text" placeholder="Price e.g. 25" class="w-full border rounded-xl px-3 py-2 mb-2">
      <input id="gift-link" type="url" placeholder="Link (optional)" class="w-full border rounded-xl px-3 py-2 mb-4">
      <div class="flex gap-2">
        <button type="button" onclick="closeAddItemModal()" class="flex-1 py-2.5 border rounded-xl">Cancel</button>
        <button type="button" onclick="saveNewItem()" class="flex-1 bg-berry text-white py-2.5 rounded-xl font-medium">Add Gift</button>
      </div>
    </div>
  </div>

  <script>
    function formatPrice(p) {
      if (!p) return '';
      const clean = String(p).replace(/[^£\d.,]/g, '');
      if (!clean) return '';
      return clean.startsWith('£') ? clean : '£' + clean;
    }

    const params = new URLSearchParams(window.location.search);
    const urlGroupCode = params.get('group');

    let groups = JSON.parse(localStorage.getItem('festive_groups') || '[]');
    let currentGroupId = localStorage.getItem('festive_current_group') || null;
    let users = JSON.parse(localStorage.getItem('festive_users') || '[]');
    let items = JSON.parse(localStorage.getItem('festive_items') || '[]');
    let currentUserId = localStorage.getItem('festive_current_user') || ('user_' + Date.now());

    if (users.length === 0) {
      users = [{ id: currentUserId, name: 'You', avatar: 'Y' }];
      localStorage.setItem('festive_users', JSON.stringify(users));
      localStorage.setItem('festive_current_user', currentUserId);
    }

    async function loadShared(code) {
      try {
        const res = await fetch('/api/family?code=' + encodeURIComponent(code));
        if (res.ok) return await res.json();
      } catch (e) {}
      return null;
    }

    async function saveShared(code, data) {
      try {
        await fetch('/api/family?code=' + encodeURIComponent(code), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
      } catch (e) {}
    }

    async function init() {
      if (urlGroupCode) {
        let g = groups.find(g => g.code === urlGroupCode);
        if (!g) {
          const data = await loadShared(urlGroupCode);
          g = { id: Date.now().toString(), name: 'Shared Group', code: urlGroupCode };
          groups.push(g);
          if (data) {
            if (data.users) users = data.users;
            if (data.items) items = data.items;
          }
        }
        currentGroupId = g.id;
      }

      if (groups.length === 0) {
        groups = [{ id: 'family', name: 'Family', code: Math.random().toString(36).slice(2, 8) }];
        currentGroupId = 'family';
      }
      if (!currentGroupId) currentGroupId = groups[0].id;

      await syncCurrent();
      renderAll();
    }

    async function syncCurrent() {
      const g = groups.find(g => g.id === currentGroupId);
      if (!g || !g.code) return;
      const data = await loadShared(g.code);
      if (data) {
        if (data.users && data.users.length) users = data.users;
        if (data.items) items = data.items;
      }
    }

    function save() {
      localStorage.setItem('festive_groups', JSON.stringify(groups));
      localStorage.setItem('festive_users', JSON.stringify(users));
      localStorage.setItem('festive_items', JSON.stringify(items));
      localStorage.setItem('festive_current_group', currentGroupId);

      const g = groups.find(g => g.id === currentGroupId);
      if (g && g.code) saveShared(g.code, { users, items });
    }

    function renderGroupTabs() {
      const container = document.getElementById('group-tabs');
      container.innerHTML = groups.map(g => `
        <button onclick="selectGroup('${g.id}')" class="px-4 py-2 rounded-full text-sm whitespace-nowrap ${g.id === currentGroupId ? 'bg-berry text-white' : 'bg-white border text-gray-700'}">${g.name}</button>
      `).join('') + `
        <button onclick="openNewGroupModal()" class="px-4 py-2 rounded-full text-sm bg-white border text-gray-500">+ New</button>
      `;
    }

    async function selectGroup(id) {
      currentGroupId = id;
      await syncCurrent();
      save();
      renderAll();
    }

    function openNewGroupModal() {
      document.getElementById('new-group-name').value = '';
      document.getElementById('new-group-modal').classList.remove('hidden');
    }
    function closeNewGroupModal() {
      document.getElementById('new-group-modal').classList.add('hidden');
    }
    function createGroup() {
      const name = document.getElementById('new-group-name').value.trim();
      if (!name) return;
      const id = Date.now().toString();
      const code = Math.random().toString(36).slice(2, 8);
      groups.push({ id, name, code });
      currentGroupId = id;
      save();
      closeNewGroupModal();
      renderAll();
      showToast('Group "' + name + '" created');
    }

    function renderFeed() {
      const container = document.getElementById('view-feed');
      const groupItems = items.filter(i => i.groupId === currentGroupId && i.ownerId !== currentUserId);
      if (groupItems.length === 0) {
        container.innerHTML = '<div class="gift-card p-8 text-center text-gray-400">No gifts in this group yet.</div>';
        return;
      }
      container.innerHTML = groupItems.map(item => {
        const owner = users.find(u => u.id === item.ownerId) || { name: 'Someone' };
        const claimed = item.claimedBy === currentUserId;
        const price = formatPrice(item.price);
        return `
          <div class="gift-card p-4 flex justify-between items-center">
            <div>
              <div class="text-xs text-pine font-medium">${owner.name}</div>
              <div class="font-medium ${claimed ? 'line-through text-gray-400' : ''}">${item.title}</div>
              ${price ? `<div class="price-tag mt-1 inline-block">${price}</div>` : ''}
            </div>
            <button onclick="toggleClaim('${item.id}')" class="text-xs px-3 py-2 rounded-xl ${claimed ? 'bg-pine text-white' : 'border border-berry text-berry'}">
              ${claimed ? "You're Buying" : 'Claim'}
            </button>
          </div>
        `;
      }).join('');
    }

    function renderMyList() {
      const container = document.getElementById('my-items-container');
      const mine = items.filter(i => i.ownerId === currentUserId && i.groupId === currentGroupId);
      if (mine.length === 0) {
        container.innerHTML = '<div class="gift-card p-8 text-center text-gray-400">Nothing on your list yet.</div>';
        return;
      }
      container.innerHTML = mine.map(item => {
        const price = formatPrice(item.price);
        return `
          <div class="gift-card p-4 flex justify-between items-center">
            <div>
              <div class="font-medium">${item.title}</div>
              ${price ? `<div class="price-tag mt-1 inline-block">${price}</div>` : ''}
            </div>
            <button onclick="deleteItem('${item.id}')" class="text-gray-300 hover:text-berry">✕</button>
          </div>
        `;
      }).join('');
    }

    function renderBuying() {
      const container = document.getElementById('buying-items-container');
      const mine = items.filter(i => i.claimedBy === currentUserId);
      if (mine.length === 0) {
        container.innerHTML = '<div class="gift-card p-8 text-center text-gray-400">You haven\'t claimed any gifts.</div>';
        return;
      }
      container.innerHTML = mine.map(item => {
        const owner = users.find(u => u.id === item.ownerId) || { name: 'Someone' };
        const group = groups.find(g => g.id === item.groupId);
        const price = formatPrice(item.price);
        return `<div class="gift-card p-4"><div class="text-xs text-berry">${group?.name || ''} · ${owner.name}</div><div class="font-medium">${item.title}</div>${price ? `<div class="price-tag mt-1 inline-block">${price}</div>` : ''}</div>`;
      }).join('');
    }

    function renderAll() {
      renderGroupTabs();
      renderFeed();
      renderMyList();
      renderBuying();
      const g = groups.find(g => g.id === currentGroupId);
      document.getElementById('greeting-text').innerText = g ? g.name : 'Merry Christmas!';
    }

    function switchTab(tab) {
      ['feed','my-list','buying'].forEach(t => {
        document.getElementById('view-' + t).classList.toggle('hidden', t !== tab);
        document.getElementById('tab-' + t).className = t === tab
          ? 'flex-1 py-2.5 rounded-lg text-center bg-white text-berry font-semibold shadow-sm'
          : 'flex-1 py-2.5 rounded-lg text-center text-gray-600';
      });
    }

    function openAddItemModal() {
      document.getElementById('gift-title').value = '';
      document.getElementById('gift-price').value = '';
      document.getElementById('gift-link').value = '';
      document.getElementById('add-item-modal').classList.remove('hidden');
      setTimeout(() => document.getElementById('gift-title').focus(), 50);
    }
    function closeAddItemModal() { document.getElementById('add-item-modal').classList.add('hidden'); }
    function saveNewItem() {
      const title = document.getElementById('gift-title').value.trim();
      if (!title) {
        showToast('Please enter a gift name');
        return;
      }
      items.push({
        id: Date.now().toString(),
        title,
        price: document.getElementById('gift-price').value.trim(),
        link: document.getElementById('gift-link').value.trim(),
        ownerId: currentUserId,
        groupId: currentGroupId,
        claimedBy: null
      });
      document.getElementById('gift-title').value = '';
      document.getElementById('gift-price').value = '';
      document.getElementById('gift-link').value = '';
      save();
      closeAddItemModal();
      renderAll();
      switchTab('my-list');
      showToast('Gift added');
    }

    function toggleClaim(id) {
      items = items.map(i => i.id === id ? { ...i, claimedBy: i.claimedBy === currentUserId ? null : currentUserId } : i);
      save();
      renderAll();
    }

    function deleteItem(id) {
      items = items.filter(i => i.id !== id);
      save();
      renderAll();
    }

    function shareCurrentGroup() {
      const g = groups.find(g => g.id === currentGroupId);
      if (!g) return;
      const url = window.location.origin + window.location.pathname + '?group=' + g.code;
      navigator.clipboard?.writeText(url);
      showToast('Link for "' + g.name + '" copied');
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.classList.remove('opacity-0','pointer-events-none');
      setTimeout(() => t.classList.add('opacity-0','pointer-events-none'), 2000);
    }

    init();
  </script>
</body>
</html>
