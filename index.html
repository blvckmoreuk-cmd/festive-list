<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="FestiveList">
  <title>FestiveList</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            berry: { DEFAULT: '#C83737', dark: '#9E2424', light: '#F9EAEB' },
            pine: { DEFAULT: '#2E5A44', dark: '#1C3B2B', light: '#EBF2EE' },
            parchment: { DEFAULT: '#FAF7F2', card: '#FFFFFF', border: '#E8E1D7' },
            gold: { DEFAULT: '#D4A359', light: '#FDF8EF' }
          },
          fontFamily: {
            sans: ['Outfit', 'sans-serif'],
            serif: ['Playfair Display', 'serif'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      background: linear-gradient(180deg, #FAF7F2 0%, #F3EDE3 100%);
      color: #2D3748;
      -webkit-tap-highlight-color: transparent;
    }
    .touch-target { min-height: 44px; min-width: 44px; }
    .bunting {
      height: 6px;
      background: repeating-linear-gradient(90deg, #C83737 0 10px, #FFFFFF 10px 20px, #2E5A44 20px 30px, #D4A359 30px 40px);
    }
    .gift-card {
      background: white;
      border: 1px solid #E8E1D7;
      border-radius: 16px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }
    .price-tag {
      background: #FDF8EF;
      color: #D4A359;
      font-weight: 500;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 12px;
    }
  </style>
</head>
<body class="min-h-screen font-sans">
  <div class="bunting"></div>
  <main class="max-w-xl mx-auto px-4 py-6">
    <header class="flex items-center justify-between mb-6 pb-4 border-b border-parchment-border">
      <div>
        <h1 class="font-serif text-2xl font-bold text-berry">🎄 FestiveList</h1>
        <p id="greeting-text" class="text-sm text-gray-500 mt-0.5">Merry Christmas!</p>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="openProfileModal()" class="flex items-center gap-2 bg-white px-3 py-1.5 rounded-full border border-parchment-border shadow-sm touch-target">
          <div id="current-user-avatar" class="w-7 h-7 rounded-full bg-berry text-white flex items-center justify-center text-xs font-medium"></div>
          <span id="current-user-name" class="text-sm font-medium">Set name</span>
        </button>
        <button onclick="shareCurrentGroup()" class="p-2.5 rounded-full bg-white border border-parchment-border text-gray-600 touch-target" title="Share this group">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/></svg>
        </button>
      </div>
    </header>

    <div id="group-tabs" class="flex gap-2 mb-4 overflow-x-auto pb-1"></div>

    <div class="flex bg-white/70 p-1 rounded-xl mb-6 border border-parchment-border">
      <button id="tab-feed" onclick="switchTab('feed')" class="flex-1 py-2.5 rounded-lg text-center bg-white text-berry font-semibold shadow-sm">Gift Feed</button>
      <button id="tab-my-list" onclick="switchTab('my-list')" class="flex-1 py-2.5 rounded-lg text-center text-gray-600">My List</button>
      <button id="tab-buying" onclick="switchTab('buying')" class="flex-1 py-2.5 rounded-lg text-center text-gray-600">I'm Buying</button>
    </div>

    <section id="view-feed" class="space-y-3"></section>
    <section id="view-my-list" class="hidden space-y-3">
      <div class="flex justify-between items-center">
        <h2 class="font-serif text-lg">My Requests</h2>
        <button
